# GMS Needle Management ERP - Supabase Local Development Config
# https://supabase.com/docs/guides/cli/config

[api]
port = 54321

[db]
port = 54322
pool_mode = "transaction"

[studio]
port = 54323

[inbucket]
port = 54324

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]

[auth.email]
# Signup is disabled: all users are created by admins via the bootstrap/invite flow
enable_signup = false
